name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, develop]

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: development
      url: https://dev.yourapp.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ci-cd-blueprint --region us-east-1

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Determine image tag
        id: image
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "tag=ghcr.io/MuhammadHarisAli/ci-cd-blueprint:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Deploy to Kubernetes
        run: |
          cd infra/k8s/overlays/${{ steps.env.outputs.environment }}
          kustomize edit set image app=${{ steps.image.outputs.tag }}
          kubectl apply -k .
          kubectl rollout status deployment/${{ steps.env.outputs.environment }}-app -n ${{ steps.env.outputs.environment }} --timeout=300s

      - name: Verify deployment
        run: |
          sleep 10
          kubectl get pods -n ${{ steps.env.outputs.environment }}
